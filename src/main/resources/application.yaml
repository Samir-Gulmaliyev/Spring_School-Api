server:
  servlet:
    context-path: /test-demo

spring:
  application:
    name: school-api

  datasource:
    url: jdbc:postgresql://localhost:5432/JpaTest
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
